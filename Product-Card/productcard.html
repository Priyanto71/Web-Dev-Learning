
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphone Product Card</title>
    <link rel="stylesheet" href="productcard.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="product-card">
        <div class="product-image">
            <img src="headphone.png" alt="wireless headphone">
        </div>
        <div class="product-info">
            <h2>Wireless Headphone</h2>
            <div class="product-tags">
                <span>BLUETOOTH</span>
                <span>BLACK</span>
            </div>
            <p>Immersive sound, soft cushioned comfort,
                and a clean modern design for everyday listening.
            </p>
            <div class="product-bottom">
                <div class="price">
                    <span>PRICE</span>
                    <h3>1500 BDT</h3>
                </div>
                <button class="cart-btn">
                    Add to cart
                </button>
            </div>
        </div>
    </div>
</body>
</html>
